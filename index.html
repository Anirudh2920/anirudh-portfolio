<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>anirudh_gotike — senior software engineer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css" />
</head>
<body data-theme="dark">
<div class="crt-noise" aria-hidden="true"></div>

<div class="tab-strip-host"></div>

<div class="app">
  <div class="rail-host"></div>
  <main class="main" id="main"></main>
</div>

<div class="status-bar-host"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="data.jsx"></script>
<script type="text/babel" src="chrome.jsx"></script>
<script type="text/babel" src="sections.jsx"></script>

<script type="text/babel">
const { useState, useEffect, useRef } = React;

function App() {
  const [theme, setTheme] = useState(() => localStorage.getItem("mr-theme") || "dark");
  const [activeTab, setActiveTab] = useState("about.md");
  const [activeSection, setActiveSection] = useState("hero");
  const [lineCount, setLineCount] = useState(1);
  const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  useEffect(() => {
    document.body.dataset.theme = theme;
    localStorage.setItem("mr-theme", theme);
  }, [theme]);

  // intersection observers for sections (scanline reveal + status bar tracking)
  useEffect(() => {
    const sections = document.querySelectorAll(".section");
    const io = new IntersectionObserver((entries) => {
      entries.forEach(e => {
        if (e.isIntersecting) {
          e.target.classList.add("visible");
        }
      });
    }, { threshold: 0.12 });
    sections.forEach(s => io.observe(s));
    return () => io.disconnect();
  }, []);

  // active section + line count
  useEffect(() => {
    const onScroll = () => {
      const sections = document.querySelectorAll(".section");
      const y = window.scrollY + window.innerHeight * 0.35;
      let current = "hero";
      sections.forEach(s => {
        const rect = s.getBoundingClientRect();
        const top = rect.top + window.scrollY;
        if (top <= y) current = s.dataset.section || s.id;
      });
      setActiveSection(current);
      // pseudo line count = scrollY / 14 (line height-ish)
      const total = document.body.scrollHeight - window.innerHeight;
      const pct = total > 0 ? window.scrollY / total : 0;
      const lines = Math.max(1, Math.round(1 + pct * 1247));
      setLineCount(lines);

      // map section to tab
      const map = { about: "about.md", experience: "experience.json", projects: "projects/", stack: "stack.toml", certs: "certs.lock", contact: "contact.sh", hero: "about.md" };
      if (map[current]) setActiveTab(map[current]);
    };
    window.addEventListener("scroll", onScroll, { passive: true });
    onScroll();
    return () => window.removeEventListener("scroll", onScroll);
  }, []);

  const onPickTab = (tabName) => {
    const sectionId = window.TABS_TO_SECTION[tabName];
    if (!sectionId) return;
    const el = document.getElementById(sectionId);
    if (el) {
      const top = el.getBoundingClientRect().top + window.scrollY - 50;
      window.scrollTo({ top, behavior: reduced ? "auto" : "smooth" });
    }
  };

  return (
    <>
      {ReactDOM.createPortal(
        <window.TabStrip
          active={activeTab}
          onPick={onPickTab}
          theme={theme}
          onThemeToggle={() => setTheme(t => t === "dark" ? "light" : "dark")}
          onMenuToggle={() => {}}
        />,
        document.querySelector(".tab-strip-host")
      )}
      {ReactDOM.createPortal(
        <window.FileRail active={activeSection} />,
        document.querySelector(".rail-host")
      )}
      {ReactDOM.createPortal(
        <window.StatusBar
          section={activeSection}
          lineCount={lineCount}
          branch="main"
        />,
        document.querySelector(".status-bar-host")
      )}

      <window.Hero reduced={reduced} />
      <window.About />
      <window.Experience />
      <window.Projects />
      <window.Stack />
      <window.Certs />
      <window.Contact />
    </>
  );
}

const root = ReactDOM.createRoot(document.getElementById("main"));
root.render(<App />);
</script>
</body>
</html>
